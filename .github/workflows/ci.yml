name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@6dfdb74cc9719e92442a28d45a3f86c855cc75cc # v1.3.6
    with:
      node-versions: '[22, 24]'
      # `build/` ships in package.json#files and the publish job builds it, so a
      # broken build used to surface only at publish time — which is how a
      # package rename in a dependency (rollup-plugin-babel -> @rollup/plugin-babel)
      # sat on master with `npm run build` failing outright.
      has-build: true
