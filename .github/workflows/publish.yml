name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@f3a51c77d39497de31ac09c4eb3f2ab8956dfbf4 # v1.3.0
    with:
      # `build/` is generated by rollup and listed in package.json#files, and
      # `npm publish --ignore-scripts` never runs prepare — without this the
      # browser bundle would be missing from the tarball.
      build-for-publish: true
    secrets: inherit
